<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign In — Express Invoicing</title>
  <link rel="stylesheet" href="css/app.css">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#12243d">
  <link rel="icon" href="img/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Invoicing">
</head>
<body>
  <div class="login-wrap">
    <form class="login-card" id="login-form" autocomplete="on">
      <div class="login-brand">
        <h1>Express Invoicing</h1>
        <p id="login-sub"></p>
      </div>

      <div id="login-message"></div>

      <div class="field">
        <label class="field-label" for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="username" required autofocus>
      </div>

      <div class="field">
        <label class="field-label" for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>

      <div class="field">
        <label class="check">
          <input type="checkbox" id="remember" checked>
          <span>Keep me signed in</span>
        </label>
      </div>

      <button type="submit" class="btn btn-primary" id="login-btn">Sign In</button>

      <div class="login-foot">
        <button type="button" class="btn-link" id="forgot">Forgot your password?</button>
      </div>
    </form>
  </div>
  <script type="module" src="js/pwa.js"></script>
  <script type="module" src="js/pages/login.js"></script>
</body>
</html>
