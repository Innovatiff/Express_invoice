<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar Sesión / Sign In — Facturación Express</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="login-wrap">
    <form class="login-card" id="login-form" autocomplete="on">
      <div class="login-brand">
        <h1>Facturación Express <span class="bi-en-inline">Express Invoicing</span></h1>
        <p id="login-sub"></p>
      </div>

      <div id="login-message"></div>

      <div class="field">
        <label class="field-label" for="email">Correo Electrónico <span class="bi-en-inline">Email</span></label>
        <input type="email" id="email" name="email" autocomplete="username" required autofocus>
      </div>

      <div class="field">
        <label class="field-label" for="password">Contraseña <span class="bi-en-inline">Password</span></label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>

      <div class="field">
        <label class="check">
          <input type="checkbox" id="remember" checked>
          <span>Mantener sesión iniciada <span class="bi-en-inline">Keep me signed in</span></span>
        </label>
      </div>

      <button type="submit" class="btn btn-primary" id="login-btn">
        <span class="bi"><span class="bi-es">Iniciar Sesión</span><span class="bi-en">Sign In</span></span>
      </button>

      <div class="login-foot">
        <button type="button" class="btn-link" id="forgot">
          ¿Olvidó su contraseña? <span class="bi-en-inline">Forgot your password?</span>
        </button>
      </div>
    </form>
  </div>
  <script type="module" src="js/pages/login.js"></script>
</body>
</html>
